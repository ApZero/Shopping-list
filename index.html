<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Supermarket List</title>
<meta name="theme-color" content="#2E7D32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Groceries">
<link rel="manifest" href="./manifest.json">
<style>
  /* ── THEMES ── */
  :root {
    --bg: #F4F1EB;
    --surface: #FDFCF9;
    --border: #DED9D0;
    --text: #1A1714;
    --muted: #8A8480;
    --accent: #3D6B40;
    --accent-light: #E6EFE6;
    --danger: #B84040;
    --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    --radius: 12px;
    --header-h: 52px;
  }
  [data-theme="forest"] {
    --bg: #EBF0E8; --surface: #F5F9F4; --border: #BED0B8;
    --text: #1B2B19; --muted: #678062; --accent: #2E6030;
    --accent-light: #D6EAD6; --danger: #A03030;
    --shadow: 0 1px 4px rgba(20,50,20,0.08), 0 4px 16px rgba(20,50,20,0.06);
  }
  [data-theme="earth"] {
    --bg: #EFE9E1; --surface: #F8F4EF; --border: #D4C8B8;
    --text: #28190E; --muted: #8A7060; --accent: #7A4F28;
    --accent-light: #EEE0D0; --danger: #A03030;
    --shadow: 0 1px 4px rgba(60,30,10,0.08), 0 4px 16px rgba(60,30,10,0.06);
  }
  [data-theme="stone"] {
    --bg: #ECEAE6; --surface: #F5F4F1; --border: #CAC6C0;
    --text: #1C1B19; --muted: #787470; --accent: #5C5650;
    --accent-light: #E4E2DE; --danger: #A03030;
    --shadow: 0 1px 4px rgba(40,38,34,0.08), 0 4px 16px rgba(40,38,34,0.06);
  }
  [data-theme="dark"] {
    --bg: #131313; --surface: #1C1C1C; --border: #2A2A2A;
    --text: #E6E6E6; --muted: #646464; --accent: #4E9E55;
    --accent-light: #182B1A; --danger: #D45050;
    --shadow: 0 1px 4px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  }
  [data-theme="dark-earth"] {
    --bg: #161210; --surface: #1E1914; --border: #2E2620;
    --text: #E4D8C8; --muted: #726254; --accent: #B87840;
    --accent-light: #281E10; --danger: #D45050;
    --shadow: 0 1px 4px rgba(0,0,0,0.35), 0 4px 16px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh; padding-bottom: 130px;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 14px; height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 1rem; font-weight: 700; letter-spacing: -0.2px; }
  .header-actions { display: flex; gap: 2px; }
  .icon-btn {
    background: none; border: none; font-size: 1.2rem; cursor: pointer;
    padding: 6px 8px; border-radius: 8px; color: var(--text);
    -webkit-tap-highlight-color: transparent; line-height: 1;
  }
  .icon-btn:active { background: var(--border); }

  /* ── TABS ── */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    background: var(--surface); padding: 0 14px; gap: 0;
  }
  .tab {
    flex: 1; padding: 9px 4px; font-size: 0.82rem; font-weight: 600;
    border: none; background: none; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--accent); border-color: var(--accent); }

  main { padding: 10px 12px; }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.9rem; line-height: 1.5; }

  /* ── SECTION CARDS ── */
  .section-card {
    background: var(--surface); border-radius: var(--radius);
    margin-bottom: 8px; box-shadow: var(--shadow);
    overflow: hidden; border-left: 4px solid #ccc;
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .section-title-row { display: flex; align-items: center; gap: 7px; }
  .section-emoji { font-size: 1.1rem; line-height: 1; }
  .section-name { font-weight: 700; font-size: 0.88rem; }
  .section-count {
    font-size: 0.7rem; color: var(--muted);
    background: var(--bg); border-radius: 20px; padding: 1px 7px;
  }
  .section-collapse-btn { font-size: 0.75rem; color: var(--muted); transition: transform 0.2s; }
  .section-collapse-btn.collapsed { transform: rotate(-90deg); }
  .section-items { padding: 0 10px 6px; }

  /* ── ITEM ROW ── */
  .item-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid var(--bg);
  }
  .item-row:last-child { border-bottom: none; }
  .item-check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--border); background: none;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: transparent; transition: all 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .item-check.checked { background: var(--accent); border-color: var(--accent); color: white; }
  .item-label-wrap { flex: 1; min-width: 0; cursor: pointer; }
  .item-label {
    font-size: 0.9rem; transition: opacity 0.12s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-label.checked { opacity: 0.35; text-decoration: line-through; }
  .item-note { font-size: 0.72rem; color: var(--muted); margin-top: 0; line-height: 1.3; }
  .item-delete {
    background: none; border: none; color: var(--border); font-size: 1rem;
    cursor: pointer; padding: 4px 2px; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .item-delete:active { color: var(--danger); }

  /* ── TWO-COLUMN ITEMS ── */
  .section-items.two-col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px;
  }
  .section-items.two-col .item-row { border-bottom: 1px solid var(--bg); }

  /* ── DONE STRIP ── */
  .done-strip {
    margin-top: 2px; padding: 6px 10px;
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px;
  }
  .done-strip-label {
    font-size: 0.68rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0;
  }
  .done-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .done-chip {
    font-size: 1.2rem; width: 36px; height: 36px; border-radius: 8px;
    border: 1.5px solid; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.5; transition: opacity 0.12s; -webkit-tap-highlight-color: transparent;
  }
  .done-chip:active { opacity: 1; }

  /* ── LIST TOOLBAR ── */
  .list-toolbar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .clear-btn {
    font-size: 0.75rem; color: var(--danger); background: none;
    border: 1px solid var(--danger); border-radius: 7px; padding: 3px 9px;
    cursor: pointer; opacity: 0.7; -webkit-tap-highlight-color: transparent;
  }
  .clear-btn:active { opacity: 1; }

  /* ── FORMS ── */
  .form-label {
    font-size: 0.72rem; font-weight: 600; color: var(--muted);
    margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .form-input {
    flex: 1; padding: 9px 11px;
    border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.92rem; background: var(--bg); color: var(--text); outline: none;
  }
  .form-input:focus { border-color: var(--accent); }
  .primary-btn {
    width: 100%; padding: 11px; border: none; border-radius: 9px;
    background: var(--accent); color: white; font-size: 0.92rem; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .primary-btn:active { opacity: 0.85; }

  /* ── PRODUCTS LIST (in config) ── */
  .cfg-products { margin: 6px 0 10px; display: flex; flex-direction: column; gap: 4px; }
  .cfg-product-row {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border-radius: 8px; padding: 6px 8px;
    border: 1px solid var(--border);
  }
  .cfg-product-name { flex: 1; font-size: 0.85rem; }
  .cfg-product-btn {
    background: none; border: none; font-size: 0.8rem; color: var(--muted);
    cursor: pointer; padding: 3px 5px; border-radius: 5px;
    -webkit-tap-highlight-color: transparent;
  }
  .cfg-product-btn:active { background: var(--bg); }
  .cfg-product-btn.danger { color: var(--danger); }

  /* ── BOTTOM INPUT BAR ── */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 12px max(12px, env(safe-area-inset-bottom));
  }
  .input-row { display: flex; gap: 7px; align-items: center; position: relative; }
  .item-input-wrap { flex: 1; position: relative; }
  #itemInput, #placeItemInput {
    width: 100%; padding: 10px 13px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 0.95rem; background: var(--bg); color: var(--text);
    outline: none; -webkit-appearance: none;
  }
  #itemInput:focus, #placeItemInput:focus { border-color: var(--accent); }
  #addBtn, #placeItemAddBtn {
    padding: 10px 15px; border: none; border-radius: 10px;
    background: var(--accent); color: white;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  #addBtn:active, #placeItemAddBtn:active { opacity: 0.8; }
  .note-row {
    display: flex; gap: 7px; margin-top: 5px;
    max-height: 0; overflow: hidden; transition: max-height 0.2s;
  }
  .note-row.visible { max-height: 50px; }
  #noteInput, #placeNoteInput {
    flex: 1; padding: 7px 11px;
    border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.84rem; background: var(--bg); color: var(--muted);
    outline: none; -webkit-appearance: none;
  }
  .note-label { font-size: 0.72rem; color: var(--muted); align-self: center; white-space: nowrap; }

  /* ── AUTOCOMPLETE ── */
  .autocomplete-list {
    position: absolute; bottom: calc(100% + 5px); left: 0; right: 0;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 11px; box-shadow: var(--shadow);
    max-height: 190px; overflow-y: auto; z-index: 200;
  }
  .autocomplete-item {
    padding: 9px 13px; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    border-bottom: 1px solid var(--bg); -webkit-tap-highlight-color: transparent;
  }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:active { background: var(--bg); }
  .ac-section-chip {
    font-size: 0.68rem; padding: 1px 6px; border-radius: 20px;
    color: white; font-weight: 600; flex-shrink: 0;
  }
  .ac-name { font-size: 0.9rem; flex: 1; }

  /* ── MODALS ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(3px);
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 18px 18px 0 0;
    padding: 18px 16px 28px; width: 100%; max-width: 480px;
    animation: slideUp 0.18s ease; max-height: 88vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
  .modal-subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
  .section-choose-list { display: flex; flex-direction: column; gap: 7px; max-height: 52vh; overflow-y: auto; }
  .section-choose-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 13px; border-radius: 10px;
    border: 1.5px solid var(--border); background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .section-choose-btn:active { background: var(--bg); }
  .section-choose-emoji { font-size: 1.1rem; }
  .section-choose-name { font-weight: 600; font-size: 0.9rem; }
  .modal-cancel {
    width: 100%; margin-top: 10px; padding: 11px;
    border: 1px solid var(--border); border-radius: 10px;
    background: none; font-size: 0.9rem; color: var(--muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-input {
    width: 100%; padding: 10px 13px; margin-bottom: 10px;
    border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.92rem; background: var(--bg); color: var(--text); outline: none;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-btn-row { display: flex; gap: 8px; margin-top: 4px; }
  .modal-primary {
    flex: 1; padding: 11px; border: none; border-radius: 9px;
    background: var(--accent); color: white; font-size: 0.92rem; font-weight: 600;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .modal-danger {
    padding: 11px 14px; border: 1px solid var(--danger); border-radius: 9px;
    background: none; color: var(--danger); font-size: 0.92rem;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }

  /* ── CONFIG MODAL ── */
  .config-tabs {
    display: flex; border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .config-tab {
    flex: 1; padding: 8px 4px; font-size: 0.85rem; font-weight: 600;
    border: none; background: none; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    -webkit-tap-highlight-color: transparent;
  }
  .config-tab.active { color: var(--accent); border-color: var(--accent); }
  .config-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .config-row {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg); border-radius: 9px; padding: 7px 9px;
  }
  .config-emoji { font-size: 1.2rem; flex-shrink: 0; line-height: 1; }
  .config-info { flex: 1; min-width: 0; }
  .config-name { font-weight: 600; font-size: 0.88rem; display: block; }
  .config-sub { font-size: 0.7rem; color: var(--muted); }
  .config-actions { display: flex; gap: 3px; flex-shrink: 0; }
  .cfg-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 7px; font-size: 0.8rem;
    cursor: pointer; color: var(--text); line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .cfg-btn:disabled { opacity: 0.25; cursor: default; }
  .cfg-btn.danger { color: var(--danger); }
  .cfg-btn:active:not(:disabled) { background: var(--border); }
  .active-btn { background: var(--accent-light) !important; color: var(--accent) !important; border-color: var(--accent) !important; }
  .config-add-form { margin-top: 10px; }
  .config-add-row-inline { display: flex; gap: 7px; align-items: center; }
  .cfg-emoji-input {
    width: 48px; flex-shrink: 0; text-align: center;
    font-size: 1.3rem; padding: 7px 2px; border-radius: 9px;
  }
  .cfg-add-btn {
    padding: 10px 14px; border: none; border-radius: 9px;
    background: var(--accent); color: white; font-size: 0.88rem;
    font-weight: 700; cursor: pointer; white-space: nowrap;
    flex-shrink: 0; -webkit-tap-highlight-color: transparent;
  }
  .cfg-add-btn:active { opacity: 0.8; }
  .cfg-hint { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
  .config-section { margin-bottom: 16px; }
  .config-section-title {
    font-size: 0.68rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .small-btn {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 7px; padding: 4px 9px;
    font-size: 0.78rem; cursor: pointer; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .small-btn:active { background: var(--border); }
  .small-btn.danger { color: var(--danger); }

  /* ── THEME PICKER ── */
  .color-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .color-opt {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .color-opt.selected { border-color: var(--text); transform: scale(1.15); }
</style>
</head>
<body>

<header>
  <h1>🛒 My Supermarket</h1>
  <div class="header-actions">
    <button class="icon-btn" id="backupBtn" title="Download backup">💾</button>
    <button class="icon-btn" id="themeBtn" title="Change theme">🎨</button>
    <button class="icon-btn" id="configBtn" title="Configuration">⚙️</button>
    <button class="icon-btn" id="clearCheckedBtn" title="Clear list">🗑</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="list">Shopping List</button>
  <button class="tab" data-tab="places">Places</button>
</div>

<main id="mainContent"></main>

<!-- Bottom input (list tab only) -->
<div class="bottom-bar" id="bottomBar">
  <div class="input-row">
    <div class="item-input-wrap">
      <input type="text" id="itemInput" placeholder="Add item…" autocomplete="off" />
      <div class="autocomplete-list" id="autocompleteList" style="display:none"></div>
    </div>
    <button id="addBtn">Add</button>
  </div>
  <div class="note-row" id="noteRow">
    <span class="note-label">Note:</span>
    <input type="text" id="noteInput" placeholder="amount, brand, specifics…" autocomplete="off" />
  </div>
</div>

<!-- Bottom input (places tab) -->
<div class="bottom-bar" id="placesBar" style="display:none">
  <div class="input-row">
    <div class="item-input-wrap">
      <input type="text" id="placeItemInput" placeholder="Add item…" autocomplete="off" />
    </div>
    <button id="placeItemAddBtn">Add</button>
  </div>
  <div class="note-row" id="placeNoteRow">
    <span class="note-label">Note:</span>
    <input type="text" id="placeNoteInput" placeholder="amount, specifics…" autocomplete="off" />
  </div>
</div>

<!-- Modal: edit item note -->
<div class="modal-overlay" id="editNoteModal">
  <div class="modal">
    <h2>Edit note</h2>
    <p class="modal-subtitle">Add an amount or detail for this item this time around.</p>
    <input type="text" class="form-input" id="editNoteInput" placeholder="e.g. 2 bags, ripe ones" style="margin-bottom:14px">
    <button class="primary-btn" onclick="saveEditNote()">Save</button>
    <button class="modal-cancel" onclick="closeEditNote()">Cancel</button>
  </div>
</div>

<!-- Modal: theme picker -->
<div class="modal-overlay" id="themeModal">
  <div class="modal">
    <h2>Appearance</h2>
    <p class="modal-subtitle">Choose a colour palette</p>
    <div style="display:flex;flex-direction:column;gap:8px" id="themeList"></div>
    <button class="modal-cancel" id="themeModalCancel">Close</button>
  </div>
</div>

<!-- Modal: config -->
<div class="modal-overlay" id="configModal">
  <div class="modal" style="max-height:90vh;display:flex;flex-direction:column;padding-bottom:0">
    <h2 style="flex-shrink:0">⚙️ Editor</h2>
    <div class="config-tabs" style="flex-shrink:0">
      <button class="config-tab active" id="cfgTabSections" onclick="switchConfigTab('sections')">Sections</button>
      <button class="config-tab" id="cfgTabPlaces" onclick="switchConfigTab('places')">Places</button>
    </div>
    <div id="configModalContent" style="flex:1;overflow-y:auto;padding-bottom:16px"></div>
    <button class="modal-cancel" id="configModalCancel" style="flex-shrink:0;margin:0;border-radius:0 0 20px 20px;border-top:1px solid var(--border)">Close</button>
  </div>
</div>

<!-- Modal: assign new product to section -->
<div class="modal-overlay" id="assignModal">
  <div class="modal">
    <h2>Which section?</h2>
    <p class="modal-subtitle" id="assignModalSubtitle"></p>
    <div class="section-choose-list" id="sectionChooseList"></div>
    <button class="modal-cancel" id="assignModalCancel">Cancel</button>
  </div>
</div>

<!-- Modal: pick place for new item -->
<div class="modal-overlay" id="placePickModal">
  <div class="modal">
    <h2>Add to which place?</h2>
    <p class="modal-subtitle" id="placePickSubtitle"></p>
    <div class="section-choose-list" id="placePickList"></div>
    <button class="modal-cancel" id="placePickCancel">Cancel</button>
  </div>
</div>

<!-- Modal: edit product -->
<div class="modal-overlay" id="editProductModal">
  <div class="modal">
    <h2>Edit product</h2>
    <input type="text" class="modal-input" id="editProductName" placeholder="Product name" />
    <p class="form-label" style="margin-bottom:8px">Move to section:</p>
    <div class="section-choose-list" id="editProductSectionList"></div>
    <div class="modal-btn-row">
      <button class="modal-primary" id="editProductSave">Save</button>
      <button class="modal-danger" id="editProductDelete">Delete</button>
    </div>
    <button class="modal-cancel" id="editProductCancel">Cancel</button>
  </div>
</div>

<!-- Modal: edit section -->
<div class="modal-overlay" id="editSectionModal">
  <div class="modal">
    <h2 id="editSectionModalTitle">Edit</h2>
    <p class="form-label">Name</p>
    <input type="text" class="modal-input" id="editSectionName" placeholder="Name" style="margin-bottom:12px" />
    <p class="form-label">Icon <span style="font-size:0.75rem;color:var(--muted)">(any emoji from your keyboard)</span></p>
    <input type="text" class="form-input cfg-emoji-input" id="editEmojiInput" maxlength="2" placeholder="🛒" style="margin-bottom:12px;font-size:1.5rem;text-align:center;width:56px" />
    <p class="form-label" id="editColorLabel">Color</p>
    <div class="color-picker" id="editColorPicker"></div>
    <div class="modal-btn-row">
      <button class="modal-primary" id="editSectionSave">Save</button>
    </div>
    <button class="modal-cancel" id="editSectionCancel">Cancel</button>
  </div>
</div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const SECTION_COLORS = [
  '#2E7D32','#1565C0','#6A1B9A','#E65100','#00695C',
  '#AD1457','#F57F17','#37474F','#4E342E','#0277BD'
];
const SECTION_EMOJIS = [
  '🥦','🥩','🥛','🍞','🧴','🍷','🧁','🛒','🧹','🐟',
  '🧀','🍎','🌶️','🥚','☕','🫙','🧂','🥫','🍝','🫒',
  '🧃','🍪','🌿','🧊','🐓','🥐','🍋','🫘','🥜','🛁',
  '🌾','📖','🧆','🥗','🫚','🍯','🌰','🫛','🥬','🍄'
];

// ─── STATE ────────────────────────────────────────────────────────────────────
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('groceryApp') || 'null') ||
      { sections: [], products: [], listItems: [], places: [] };
    if (!s.places) s.places = [];
    return s;
  } catch { return { sections: [], products: [], listItems: [], places: [] }; }
}
function saveState() { localStorage.setItem('groceryApp', JSON.stringify(state)); }
let state = loadState();
let currentTab = 'list';
let pendingNewItem = null;
let editingProductId = null;
let editingProductSectionId = null;
let editingSectionId = null;
let editingSectionEmoji = null;
let editingSectionColor = null;

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  if (currentTab === 'list') renderList();
  else if (currentTab === 'places') renderPlaces();
  document.getElementById('bottomBar').style.display = currentTab === 'list' ? '' : 'none';
  document.getElementById('placesBar').style.display = currentTab === 'places' ? '' : 'none';
}

function renderList() {
  const main = document.getElementById('mainContent');
  if (state.listItems.length === 0) {
    main.innerHTML = `<div class="empty-state">
      <div class="emoji">🛍️</div>
      <p>Your list is empty.<br>Type an item below to get started.</p>
    </div>`;
    return;
  }

  const checkedItems = state.listItems.filter(i => i.checked);
  let html = '';
  if (checkedItems.length > 0) {
    html += `<div class="list-toolbar">
      <button class="clear-btn" onclick="clearChecked()">Remove ${checkedItems.length} checked</button>
    </div>`;
  }

  // Separate done sections from active ones
  const doneSections = [];

  state.sections.forEach(section => {
    const items = state.listItems.filter(li => {
      const p = state.products.find(p => p.name.toLowerCase() === li.name.toLowerCase());
      return p && p.sectionId === section.id;
    });
    if (items.length === 0) return;
    const unchecked = items.filter(i => !i.checked);
    const allDone = unchecked.length === 0;

    if (allDone) {
      doneSections.push(section);
      return;
    }

    const all = [...unchecked, ...items.filter(i => i.checked)];
    html += `<div class="section-card" style="border-left-color:${section.color}">
      <div class="section-header" onclick="toggleSection('${section.id}')">
        <div class="section-title-row">
          <span class="section-emoji">${section.emoji}</span>
          <span class="section-name">${escHtml(section.name)}</span>
          <span class="section-count">${unchecked.length}/${all.length}</span>
        </div>
        <span class="section-collapse-btn ${section.collapsed ? 'collapsed' : ''}">▼</span>
      </div>`;
    if (!section.collapsed) {
      html += `<div class="section-items${section.twoCol?' two-col':''}">`;
      all.forEach(item => { html += renderItemRow(item); });
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Others
  const othersItems = state.listItems.filter(li => li.isOther);
  const unassigned = state.listItems.filter(li => {
    if (li.isOther) return false;
    const p = state.products.find(p => p.name.toLowerCase() === li.name.toLowerCase());
    return !p || !state.sections.find(s => s.id === p.sectionId);
  });
  const allOthers = [...unassigned, ...othersItems];
  const othersCollapsed = state.othersCollapsed || false;
  const othersAllDone = allOthers.length > 0 && allOthers.every(i => i.checked);

  if (allOthers.length > 0 && !othersAllDone) {
    const uncheckedOthers = allOthers.filter(i => !i.checked);
    html += `<div class="section-card" style="border-left-color:#999">
      <div class="section-header" onclick="toggleOthers()">
        <div class="section-title-row">
          <span class="section-emoji">🧺</span>
          <span class="section-name">Others</span>
          <span class="section-count">${uncheckedOthers.length}/${allOthers.length}</span>
        </div>
        <span class="section-collapse-btn ${othersCollapsed ? 'collapsed' : ''}">▼</span>
      </div>`;
    if (!othersCollapsed) {
      html += `<div class="section-items">`;
      allOthers.forEach(item => { html += renderItemRow(item); });
      html += `</div>`;
    }
    html += `</div>`;
  }

  // Done strip — compact emoji chips for fully completed sections
  const doneChips = [...doneSections.map(s => ({ emoji: s.emoji, name: s.name, color: s.color, id: s.id, isOthers: false })),
    ...(othersAllDone ? [{ emoji: '🧺', name: 'Others', color: '#999', id: null, isOthers: true }] : [])];

  if (doneChips.length > 0) {
    html += `<div class="done-strip">
      <span class="done-strip-label">Done</span>
      <div class="done-chips">
        ${doneChips.map(s => `
          <button class="done-chip" title="${escHtml(s.name)}"
            style="border-color:${s.color};color:${s.color}"
            onclick="${s.isOthers ? 'toggleOthers()' : `toggleSection('${s.id}')`}">
            ${s.emoji}
          </button>`).join('')}
      </div>
    </div>`;
  }

  main.innerHTML = html;
}

function renderItemRow(item) {
  const noteHtml = item.note
    ? `<div class="item-note">${escHtml(item.note)}</div>` : '';
  return `<div class="item-row">
    <button class="item-check ${item.checked ? 'checked' : ''}" onclick="toggleItem('${item.id}')">
      ${item.checked ? '✓' : ''}
    </button>
    <div class="item-label-wrap" onclick="openEditNote('${item.id}')">
      <div class="item-label ${item.checked ? 'checked' : ''}">${escHtml(item.name)}</div>
      ${noteHtml}
    </div>
    <button class="item-delete" onclick="removeListItem('${item.id}')">✕</button>
  </div>`;
}

let editingNoteItemId = null;
function openEditNote(itemId) {
  const item = state.listItems.find(i => i.id === itemId);
  if (!item) return;
  editingNoteItemId = itemId;
  document.getElementById('editNoteInput').value = item.note || '';
  document.getElementById('editNoteModal').classList.add('open');
  setTimeout(() => document.getElementById('editNoteInput').focus(), 100);
}
function saveEditNote() {
  const val = document.getElementById('editNoteInput').value.trim();
  if (editingNoteItemId) {
    const item = state.listItems.find(i => i.id === editingNoteItemId);
    if (item) item.note = val || null;
  } else if (editingPlaceNoteRef) {
    const place = state.places.find(p => p.id === editingPlaceNoteRef.placeId);
    if (place) {
      const item = place.items.find(i => i.id === editingPlaceNoteRef.itemId);
      if (item) item.note = val || null;
    }
  }
  saveState();
  closeEditNote();
  render();
}
function closeEditNote() {
  document.getElementById('editNoteModal').classList.remove('open');
  editingNoteItemId = null;
  editingPlaceNoteRef = null;
}

function renderManage() {
  const main = document.getElementById('mainContent');
  let html = `
    <div class="add-section-form">
      <div class="form-title">New section</div>
      <label class="form-label">Name</label>
      <div class="form-row">
        <input class="form-input" id="newSectionName" placeholder="e.g. Produce" />
      </div>
      <label class="form-label">Icon</label>
      <div class="emoji-picker">
        ${SECTION_EMOJIS.map((e,i) => `<span class="emoji-opt ${i===0?'selected':''}" onclick="selectEmoji(this,'${e}')">${e}</span>`).join('')}
      </div>
      <label class="form-label">Color</label>
      <div class="color-picker">
        ${SECTION_COLORS.map((c,i) => `<div class="color-opt ${i===0?'selected':''}" style="background:${c}" onclick="selectColor(this,'${c}')"></div>`).join('')}
      </div>
      <button class="primary-btn" onclick="addSection()">Add Section</button>
    </div>`;

  if (state.sections.length === 0) {
    html += `<div class="empty-state"><div class="emoji">🗺️</div><p>No sections yet.<br>Add your first aisle above.</p></div>`;
  } else {
    html += `<p style="font-size:0.8rem;color:var(--muted);margin-bottom:8px;padding:0 2px">Drag to reorder · tap a section to see its products · tap Edit to change name/icon/color</p>`;
    state.sections.forEach((s, idx) => {
      const products = state.products.filter(p => p.sectionId === s.id);
      html += `<div class="products-section" style="border-left-color:${s.color}" draggable="true"
        ondragstart="dragStart(event,${idx})" ondragover="dragOver(event,${idx})" ondrop="dragDrop(event,${idx})" ondragleave="dragLeave(event)">
        <div class="products-section-header" onclick="toggleProductsSection('${s.id}')">
          <div class="section-title-row">
            <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
            <span class="section-emoji">${s.emoji}</span>
            <span class="section-name">${escHtml(s.name)}</span>
            <span class="section-count">${products.length} product${products.length!==1?'s':''}</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="small-btn" onclick="event.stopPropagation();openEditSection('${s.id}')">Edit</button>
            <button class="small-btn danger" onclick="event.stopPropagation();deleteSection('${s.id}')">Delete</button>
          </div>
        </div>`;

      if (!s.productsCollapsed) {
        html += `<div class="products-list">`;
        if (products.length === 0) {
          html += `<p style="font-size:0.82rem;color:var(--muted);padding:4px 0">No products yet.</p>`;
        } else {
          products.forEach(p => {
            html += `<div class="product-row">
              <span class="product-name">${escHtml(p.name)}</span>
              <button class="product-edit-btn" onclick="openEditProduct('${p.id}')">✏️</button>
            </div>`;
          });
        }
        html += `<div class="add-product-row">
          <input class="add-product-input" id="newProduct_${s.id}" placeholder="Add product…" autocomplete="off"
            onkeydown="if(event.key==='Enter') addProductToSection('${s.id}')" />
          <button class="add-product-btn" onclick="addProductToSection('${s.id}')">+</button>
        </div>`;
        html += `</div>`;
      }
      html += `</div>`;
    });
  }

  main.innerHTML = html;
  window._selectedEmoji = SECTION_EMOJIS[0];
  window._selectedColor = SECTION_COLORS[0];
}

// ─── SECTION ACTIONS ─────────────────────────────────────────────────────────
function deleteSection(id) {
  if (!confirm('Delete this section? Products assigned to it will become unassigned.')) return;
  state.sections = state.sections.filter(s => s.id !== id);
  state.products = state.products.map(p => p.sectionId === id ? {...p, sectionId: null} : p);
  saveState(); render();
}

function toggleSection(id) {
  const s = state.sections.find(s => s.id === id);
  if (s) s.collapsed = !s.collapsed;
  saveState(); render();
}

function toggleProductsSection(id) {
  const s = state.sections.find(s => s.id === id);
  if (s) s.productsCollapsed = !s.productsCollapsed;
  saveState(); render();
}

function selectEmoji(el, emoji) {
  el.closest('.emoji-picker').querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  window._selectedEmoji = emoji;
}
function selectColor(el, color) {
  el.closest('.color-picker').querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  window._selectedColor = color;
}

// ─── EDIT SECTION MODAL ───────────────────────────────────────────────────────
function openEditSection(id) {
  const s = state.sections.find(s => s.id === id);
  if (!s) return;
  editingSectionId = id; editingPlaceId = null;
  editingSectionColor = s.color;
  document.getElementById('editSectionModalTitle').textContent = 'Edit Section';
  document.getElementById('editSectionName').value = s.name;
  document.getElementById('editEmojiInput').value = s.emoji;
  const cp = document.getElementById('editColorPicker');
  cp.style.display = '';
  document.getElementById('editColorLabel').style.display = '';
  cp.innerHTML = SECTION_COLORS.map(c =>
    `<div class="color-opt ${c===s.color?'selected':''}" style="background:${c}" onclick="pickEditColor(this,'${c}')"></div>`
  ).join('');
  document.getElementById('editSectionModal').classList.add('open');
}
function pickEditColor(el, color) {
  document.getElementById('editColorPicker').querySelectorAll('.color-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  editingSectionColor = color;
}
document.getElementById('editSectionSave').onclick = () => {
  const name = document.getElementById('editSectionName').value.trim();
  const emoji = document.getElementById('editEmojiInput').value.trim() || '🛒';
  if (!name) return alert('Please enter a name.');
  if (editingPlaceId) {
    const p = state.places.find(p => p.id === editingPlaceId);
    if (p) { p.name = name; p.emoji = emoji; }
    editingPlaceId = null;
  } else {
    const s = state.sections.find(s => s.id === editingSectionId);
    if (s) { s.name = name; s.emoji = emoji; s.color = editingSectionColor; }
  }
  document.getElementById('editColorPicker').style.display = '';
  document.getElementById('editColorLabel').style.display = '';
  saveState();
  document.getElementById('editSectionModal').classList.remove('open');
  renderConfigContent(); render();
};
document.getElementById('editSectionCancel').onclick = () => {
  editingPlaceId = null;
  document.getElementById('editColorPicker').style.display = '';
  document.getElementById('editColorLabel').style.display = '';
  document.getElementById('editSectionModal').classList.remove('open');
};

// ─── PRODUCT ACTIONS ──────────────────────────────────────────────────────────
function addProductToSection(sectionId) {
  const input = document.getElementById('newProduct_' + sectionId);
  if (!input) return;
  const name = input.value.trim();
  if (!name) return;
  if (state.products.find(p => p.name.toLowerCase() === name.toLowerCase())) {
    alert(`"${name}" already exists.`); return;
  }
  state.products.push({ id: 'p_' + Date.now(), name, sectionId });
  saveState(); render();
}

function openEditProduct(productId) {
  const p = state.products.find(p => p.id === productId);
  if (!p) return;
  editingProductId = productId;
  editingProductSectionId = p.sectionId;

  document.getElementById('editProductName').value = p.name;

  const list = document.getElementById('editProductSectionList');
  list.innerHTML = state.sections.map(s =>
    `<button class="section-choose-btn ${s.id===p.sectionId?'':''}
      " style="border-color:${s.id===p.sectionId?s.color:'var(--border)'};background:${s.id===p.sectionId?'var(--accent-light)':''}"
      onclick="pickEditProductSection(this,'${s.id}','${s.color}')">
      <span class="section-choose-emoji">${s.emoji}</span>
      <span class="section-choose-name">${escHtml(s.name)}</span>
    </button>`
  ).join('');

  document.getElementById('editProductModal').classList.add('open');
}

function pickEditProductSection(el, sectionId, color) {
  document.getElementById('editProductSectionList').querySelectorAll('.section-choose-btn').forEach(b => {
    b.style.borderColor = 'var(--border)'; b.style.background = '';
  });
  el.style.borderColor = color; el.style.background = 'var(--accent-light)';
  editingProductSectionId = sectionId;
}

document.getElementById('editProductSave').onclick = () => {
  const name = document.getElementById('editProductName').value.trim();
  if (!name) return alert('Please enter a name.');
  const p = state.products.find(p => p.id === editingProductId);
  if (p) { p.name = name; p.sectionId = editingProductSectionId; }
  // Also update any list items using the old name
  const oldName = p ? p.name : '';
  state.listItems.forEach(li => { if (li.name === oldName) li.name = name; });
  saveState();
  document.getElementById('editProductModal').classList.remove('open');
  render();
};

document.getElementById('editProductDelete').onclick = () => {
  if (!confirm('Remove this product from your known products? It won\'t be deleted from the current list.')) return;
  state.products = state.products.filter(p => p.id !== editingProductId);
  saveState();
  document.getElementById('editProductModal').classList.remove('open');
  render();
};

document.getElementById('editProductCancel').onclick = () => {
  document.getElementById('editProductModal').classList.remove('open');
};

// ─── DRAG & DROP ─────────────────────────────────────────────────────────────
let dragSrcIdx = null;
function dragStart(e, idx) { dragSrcIdx = idx; e.currentTarget.classList.add('dragging'); }
function dragOver(e, idx) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dragDrop(e, idx) {
  e.currentTarget.classList.remove('drag-over');
  if (dragSrcIdx === null || dragSrcIdx === idx) return;
  const moved = state.sections.splice(dragSrcIdx, 1)[0];
  state.sections.splice(idx, 0, moved);
  dragSrcIdx = null; saveState(); render();
}

// ─── LIST ACTIONS ─────────────────────────────────────────────────────────────
function toggleItem(id) {
  const item = state.listItems.find(i => i.id === id);
  if (item) item.checked = !item.checked;
  // Auto-collapse section if all its items are now checked
  state.sections.forEach(section => {
    const items = state.listItems.filter(li => {
      const p = state.products.find(p => p.name.toLowerCase() === li.name.toLowerCase());
      return p && p.sectionId === section.id;
    });
    if (items.length > 0 && items.every(i => i.checked)) {
      section.collapsed = true;
    }
  });
  // Auto-collapse Others if all checked
  const othersItems2 = state.listItems.filter(li => {
    if (li.isOther) return true;
    const p = state.products.find(p => p.name.toLowerCase() === li.name.toLowerCase());
    return !p || !state.sections.find(s => s.id === p.sectionId);
  });
  if (othersItems2.length > 0 && othersItems2.every(i => i.checked)) {
    state.othersCollapsed = true;
  }
  saveState(); render();
}
function toggleOthers() {
  state.othersCollapsed = !state.othersCollapsed;
  saveState(); render();
}
function removeListItem(id) {
  state.listItems = state.listItems.filter(i => i.id !== id);
  saveState(); render();
}
function clearChecked() {
  state.listItems = state.listItems.filter(i => !i.checked);
  saveState(); render();
}
function clearFullList() {
  if (!confirm('Clear the entire shopping list? Your sections and saved products won\'t be affected.')) return;
  state.listItems = [];
  state.sections.forEach(s => s.collapsed = false);
  state.othersCollapsed = false;
  saveState(); render();
}
document.getElementById('backupBtn').onclick = exportBackup;
document.getElementById('clearCheckedBtn').onclick = clearFullList;

// ─── ADD ITEM ─────────────────────────────────────────────────────────────────
function addItem(name) {
  name = name.trim();
  if (!name) return;
  const note = document.getElementById('noteInput').value.trim();

  if (state.listItems.find(i => i.name.toLowerCase() === name.toLowerCase())) {
    alert(`"${name}" is already on your list.`); return;
  }

  const known = state.products.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (known) {
    state.listItems.push({ id: 'li_' + Date.now(), name: known.name, note, checked: false });
    // Auto-expand the section
    const section = state.sections.find(s => s.id === known.sectionId);
    if (section) section.collapsed = false;
    saveState(); render();
    document.getElementById('noteInput').value = '';
    document.getElementById('noteRow').classList.remove('visible');
  } else {
    pendingNewItem = { name, note };
    openAssignModal(name);
  }
}

function openAssignModal(name) {
  document.getElementById('assignModalSubtitle').textContent = `"${name}" isn't saved yet. Pick a section:`;
  const list = document.getElementById('sectionChooseList');
  const othersBtn = `<button class="section-choose-btn" style="border-color:#999" onclick="assignOthers()">
    <span class="section-choose-emoji">🧺</span>
    <span class="section-choose-name">Others <span style="font-size:0.75rem;color:var(--muted)">(don't save)</span></span>
  </button>`;
  if (state.sections.length === 0) {
    list.innerHTML = `<p style="color:var(--muted);font-size:0.9rem;margin-bottom:8px">No sections yet. Go to the Sections tab first.</p>` + othersBtn;
  } else {
    list.innerHTML = state.sections.map(s =>
      `<button class="section-choose-btn" style="border-color:${s.color}" onclick="assignSection('${s.id}')">
        <span class="section-choose-emoji">${s.emoji}</span>
        <span class="section-choose-name">${escHtml(s.name)}</span>
      </button>`
    ).join('') + othersBtn;
  }
  document.getElementById('assignModal').classList.add('open');
}

function assignSection(sectionId) {
  if (!pendingNewItem) return;
  const { name, note } = pendingNewItem;
  state.products.push({ id: 'p_' + Date.now(), name, sectionId });
  state.listItems.push({ id: 'li_' + Date.now(), name, note, checked: false });
  // Auto-expand the section
  const section = state.sections.find(s => s.id === sectionId);
  if (section) section.collapsed = false;
  saveState();
  pendingNewItem = null;
  closeAssignModal();
  document.getElementById('noteInput').value = '';
  document.getElementById('noteRow').classList.remove('visible');
  render();
}

function assignOthers() {
  if (!pendingNewItem) return;
  const { name, note } = pendingNewItem;
  state.listItems.push({ id: 'li_' + Date.now(), name, note, checked: false, isOther: true });
  state.othersCollapsed = false;
  saveState();
  pendingNewItem = null;
  closeAssignModal();
  document.getElementById('noteInput').value = '';
  document.getElementById('noteRow').classList.remove('visible');
  render();
}

function closeAssignModal() {
  document.getElementById('assignModal').classList.remove('open');
  pendingNewItem = null;
}
document.getElementById('assignModalCancel').onclick = closeAssignModal;

// ─── INPUT & AUTOCOMPLETE ─────────────────────────────────────────────────────
const itemInput = document.getElementById('itemInput');
const autocompleteList = document.getElementById('autocompleteList');
const noteRow = document.getElementById('noteRow');

itemInput.addEventListener('input', () => {
  const val = itemInput.value.trim().toLowerCase();
  // Show note field once user starts typing
  if (val.length > 0) noteRow.classList.add('visible');
  else noteRow.classList.remove('visible');

  if (!val) { autocompleteList.style.display = 'none'; return; }
  const matches = state.products.filter(p =>
    p.name.toLowerCase().includes(val) && p.name.toLowerCase() !== val
  );
  if (matches.length === 0) { autocompleteList.style.display = 'none'; return; }

  autocompleteList.innerHTML = matches.slice(0, 8).map(p => {
    const section = state.sections.find(s => s.id === p.sectionId);
    const chip = section
      ? `<span class="ac-section-chip" style="background:${section.color}">${section.emoji} ${escHtml(section.name)}</span>`
      : '';
    return `<div class="autocomplete-item" onclick="selectAutocomplete('${escAttr(p.name)}')">
      <span class="ac-name">${escHtml(p.name)}</span>${chip}
    </div>`;
  }).join('');
  autocompleteList.style.display = 'block';
});

function selectAutocomplete(name) {
  itemInput.value = name;
  autocompleteList.style.display = 'none';
  document.getElementById('noteInput').focus();
}

document.getElementById('addBtn').onclick = () => {
  const val = itemInput.value.trim();
  if (!val) return;
  autocompleteList.style.display = 'none';
  addItem(val);
  itemInput.value = '';
  itemInput.focus();
};

itemInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
  if (e.key === 'Escape') autocompleteList.style.display = 'none';
});
document.getElementById('noteInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.item-input-wrap')) autocompleteList.style.display = 'none';
});

// ─── PLACES INPUT BAR ────────────────────────────────────────────────────────
let pendingPlaceItem = null;

document.getElementById('placeItemInput').addEventListener('input', () => {
  const val = document.getElementById('placeItemInput').value.trim();
  const noteRow = document.getElementById('placeNoteRow');
  if (val.length > 0) noteRow.classList.add('visible');
  else noteRow.classList.remove('visible');
});

document.getElementById('placeItemAddBtn').onclick = () => {
  const name = document.getElementById('placeItemInput').value.trim();
  if (!name) return;
  const note = document.getElementById('placeNoteInput').value.trim();
  if (state.places.length === 0) { alert('Add a place first via ⚙️'); return; }
  if (state.places.length === 1) {
    // Only one place — add directly
    addPlaceItem(state.places[0].id, name, note);
    document.getElementById('placeItemInput').value = '';
    document.getElementById('placeNoteInput').value = '';
    document.getElementById('placeNoteRow').classList.remove('visible');
  } else {
    // Multiple places — show picker
    pendingPlaceItem = { name, note };
    openPlacePicker(name);
  }
};

document.getElementById('placeItemInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('placeItemAddBtn').click();
});
document.getElementById('placeNoteInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('placeItemAddBtn').click();
});

function openPlacePicker(name) {
  document.getElementById('placePickSubtitle').textContent = `Where does "${name}" go?`;
  document.getElementById('placePickList').innerHTML = state.places.map(p =>
    `<button class="section-choose-btn" style="border-color:${p.color}" onclick="confirmPlacePick('${p.id}')">
      <span class="section-choose-emoji">${p.emoji || '📍'}</span>
      <span class="section-choose-name">${escHtml(p.name)}</span>
    </button>`
  ).join('');
  document.getElementById('placePickModal').classList.add('open');
}

function confirmPlacePick(placeId) {
  if (!pendingPlaceItem) return;
  addPlaceItem(placeId, pendingPlaceItem.name, pendingPlaceItem.note);
  pendingPlaceItem = null;
  document.getElementById('placePickModal').classList.remove('open');
  document.getElementById('placeItemInput').value = '';
  document.getElementById('placeNoteInput').value = '';
  document.getElementById('placeNoteRow').classList.remove('visible');
  document.getElementById('placeItemInput').focus();
}

document.getElementById('placePickCancel').onclick = () => {
  pendingPlaceItem = null;
  document.getElementById('placePickModal').classList.remove('open');
};

document.getElementById('configBtn').onclick = openConfig;

// ─── TABS ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
    render();
  };
});

// ─── UTILS ───────────────────────────────────────────────────────────────────
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

let activePlaceId = null; // kept for backward compat, no longer used for selection

// ─── PLACES ──────────────────────────────────────────────────────────────────
function renderPlaces() {
  const main = document.getElementById('mainContent');

  if (state.places.length === 0) {
    main.innerHTML = `<div class="empty-state">
      <div class="emoji">📍</div>
      <p>No places yet.<br>Tap ⚙️ to add a place like Farmacia or Ferretería.</p>
    </div>`;
    return;
  }

  const checkedPlaceItems = state.places.reduce((acc, p) => acc + (p.items||[]).filter(i=>i.checked).length, 0);
  let html = '';
  if (checkedPlaceItems > 0) {
    html += `<div class="list-toolbar">
      <button class="clear-btn" onclick="clearAllPlaceChecked()">Remove ${checkedPlaceItems} checked</button>
    </div>`;
  }

  const donePlaces = [];

  state.places.forEach(place => {
    const items = place.items || [];
    const unchecked = items.filter(i => !i.checked);
    const checked = items.filter(i => i.checked);
    const allDone = items.length > 0 && unchecked.length === 0;

    if (allDone) { donePlaces.push(place); return; }

    const isCollapsed = place.collapsed || false;
    const all = [...unchecked, ...checked];

    html += `<div class="section-card" style="border-left-color:${place.color || '#888'}">
      <div class="section-header" onclick="togglePlace('${place.id}')">
        <div class="section-title-row">
          <span class="section-emoji">${place.emoji || '📍'}</span>
          <span class="section-name">${escHtml(place.name)}</span>
          ${items.length > 0 ? `<span class="section-count">${unchecked.length}/${items.length}</span>` : ''}
        </div>
        <span class="section-collapse-btn ${isCollapsed ? 'collapsed' : ''}">▼</span>
      </div>`;

    if (!isCollapsed) {
      html += `<div class="section-items">`;
      if (all.length === 0) {
        html += `<p style="font-size:0.85rem;color:var(--muted);padding:4px 0 8px;font-style:italic">No items yet — type below to add</p>`;
      }
      all.forEach(item => {
        html += `<div class="item-row">
          <button class="item-check ${item.checked ? 'checked' : ''}" onclick="togglePlaceItem('${place.id}','${item.id}')">
            ${item.checked ? '✓' : ''}
          </button>
          <div class="item-label-wrap" onclick="editPlaceItemNote('${place.id}','${item.id}')">
            <div class="item-label ${item.checked ? 'checked' : ''}">${escHtml(item.name)}</div>
            ${item.note ? `<div class="item-note">${escHtml(item.note)}</div>` : ''}
          </div>
          <button class="item-delete" onclick="removePlaceItem('${place.id}','${item.id}')">✕</button>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Done strip
  if (donePlaces.length > 0) {
    html += `<div class="done-strip">
      <span class="done-strip-label">Done</span>
      <div class="done-chips">
        ${donePlaces.map(p => `
          <button class="done-chip" title="${escHtml(p.name)}"
            style="border-color:${p.color};color:${p.color}"
            onclick="togglePlace('${p.id}')">
            ${p.emoji || '📍'}
          </button>`).join('')}
      </div>
    </div>`;
  }

  main.innerHTML = html;
}

function togglePlace(id) {
  const place = state.places.find(p => p.id === id);
  if (!place) return;
  // If it was in "done" state (all checked), uncollapse it
  const items = place.items || [];
  const allDone = items.length > 0 && items.every(i => i.checked);
  if (allDone) {
    place.collapsed = false;
  } else {
    place.collapsed = !place.collapsed;
  }
  saveState(); render();
}

function addPlace() {
  const nameEl = document.getElementById('newPlaceName');
  const name = nameEl.value.trim();
  if (!name) return;
  const placeColors = ['#1565C0','#6A1B9A','#E65100','#00695C','#AD1457','#37474F','#4E342E','#0277BD'];
  const color = placeColors[state.places.length % placeColors.length];
  const emojis = ['📍','🏥','🔧','🛍️','💊','🧰','🏪','🏬'];
  const emoji = emojis[state.places.length % emojis.length];
  state.places.push({ id: 'pl_' + Date.now(), name, color, emoji, items: [] });
  activePlaceId = state.places[state.places.length - 1].id;
  saveState(); render();
}

function deletePlace(id) {
  const place = state.places.find(p => p.id === id);
  if (!confirm(`Delete "${place?.name}"?`)) return;
  state.places = state.places.filter(p => p.id !== id);
  if (activePlaceId === id) activePlaceId = null;
  saveState(); render();
}

function addPlaceItem(placeId, name, note) {
  const place = state.places.find(p => p.id === placeId);
  if (!place) return;
  if (!place.items) place.items = [];
  place.items.push({ id: 'pli_' + Date.now(), name, note: note || null, checked: false });
  place.collapsed = false;
  saveState(); render();
}

function togglePlaceItem(placeId, itemId) {
  const place = state.places.find(p => p.id === placeId);
  if (!place) return;
  const item = place.items.find(i => i.id === itemId);
  if (item) item.checked = !item.checked;
  // Auto-collapse when all done
  if (place.items.length > 0 && place.items.every(i => i.checked)) {
    place.collapsed = true;
  }
  saveState(); render();
}

function removePlaceItem(placeId, itemId) {
  const place = state.places.find(p => p.id === placeId);
  if (!place) return;
  place.items = place.items.filter(i => i.id !== itemId);
  saveState(); render();
}

function clearAllPlaceChecked() {
  const total = state.places.reduce((a, p) => a + (p.items||[]).filter(i=>i.checked).length, 0);
  if (!confirm(`Remove ${total} checked item${total!==1?'s':''}?`)) return;
  state.places.forEach(p => { if (p.items) p.items = p.items.filter(i => !i.checked); });
  saveState(); render();
}

function clearPlaceChecked(placeId) {
  const place = state.places.find(p => p.id === placeId);
  if (!place) return;
  if (!confirm(`Remove all checked items from ${place.name}?`)) return;
  place.items = place.items.filter(i => !i.checked);
  saveState(); render();
}

let editingPlaceNoteRef = null;
function editPlaceItemNote(placeId, itemId) {
  const place = state.places.find(p => p.id === placeId);
  if (!place) return;
  const item = place.items.find(i => i.id === itemId);
  if (!item) return;
  editingPlaceNoteRef = { placeId, itemId };
  document.getElementById('editNoteInput').value = item.note || '';
  document.getElementById('editNoteModal').classList.add('open');
  setTimeout(() => document.getElementById('editNoteInput').focus(), 100);
}

// ─── CONFIG PRODUCT HELPERS ───────────────────────────────────────────────────
function toggleSectionTwoCol(id) {
  const s = state.sections.find(s => s.id === id);
  if (s) s.twoCol = !s.twoCol;
  saveState(); render(); renderConfigContent();
}

function addProductFromConfig(sectionId) {
  const input = document.getElementById('newProd_' + sectionId);
  if (!input) return;
  const name = input.value.trim();
  if (!name) return;
  if (state.products.find(p => p.name.toLowerCase() === name.toLowerCase())) {
    alert(`"${name}" already exists.`); return;
  }
  state.products.push({ id: 'p_' + Date.now(), name, sectionId });
  input.value = '';
  saveState(); renderConfigContent();
}

function deleteProductFromConfig(productId) {
  const p = state.products.find(p => p.id === productId);
  if (!p) return;
  if (!confirm(`Delete "${p.name}"?`)) return;
  state.products = state.products.filter(pr => pr.id !== productId);
  saveState(); renderConfigContent();
}

// ─── CONFIG MODAL ────────────────────────────────────────────────────────────
let configTab = 'sections';

function switchConfigTab(tab) {
  configTab = tab;
  document.getElementById('cfgTabSections').classList.toggle('active', tab === 'sections');
  document.getElementById('cfgTabPlaces').classList.toggle('active', tab === 'places');
  renderConfigContent();
}

function openConfig() {
  document.getElementById('configModal').classList.add('open');
  renderConfigContent();
}

function moveSection(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= state.sections.length) return;
  [state.sections[idx], state.sections[newIdx]] = [state.sections[newIdx], state.sections[idx]];
  saveState(); render(); renderConfigContent();
}

function renderConfigContent() {
  const content = document.getElementById('configModalContent');

  if (configTab === 'sections') {
    let html = `<div class="config-section">`;
    if (state.sections.length === 0) {
      html += `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">No sections yet. Add one below.</p>`;
    } else {
      state.sections.forEach((s, idx) => {
        const products = state.products.filter(p => p.sectionId === s.id);
        const twoCol = s.twoCol || false;
        html += `<div class="config-row" style="flex-direction:column;align-items:stretch;gap:6px;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:7px">
            <span class="config-emoji">${s.emoji}</span>
            <div class="config-info">
              <span class="config-name">${escHtml(s.name)}</span>
              <span class="config-sub">${products.length} product${products.length!==1?'s':''}</span>
            </div>
            <div class="config-actions">
              <button class="cfg-btn" onclick="moveSection(${idx},-1)" ${idx===0?'disabled':''}>↑</button>
              <button class="cfg-btn" onclick="moveSection(${idx},1)" ${idx===state.sections.length-1?'disabled':''}>↓</button>
              <button class="cfg-btn ${twoCol?'active-btn':''}" onclick="toggleSectionTwoCol('${s.id}')" title="Two columns">${twoCol?'⊞':'⊟'}</button>
              <button class="cfg-btn" onclick="openEditSection('${s.id}')">✏️</button>
              <button class="cfg-btn danger" onclick="deleteSection('${s.id}');renderConfigContent()">✕</button>
            </div>
          </div>`;

        // Products list
        if (products.length > 0) {
          html += `<div class="cfg-products">`;
          products.forEach(p => {
            html += `<div class="cfg-product-row">
              <span class="cfg-product-name">${escHtml(p.name)}</span>
              <button class="cfg-product-btn" onclick="openEditProduct('${p.id}')">✏️</button>
              <button class="cfg-product-btn danger" onclick="deleteProductFromConfig('${p.id}')">✕</button>
            </div>`;
          });
          html += `</div>`;
        }

        // Add product inline
        html += `<div style="display:flex;gap:6px;padding-top:2px">
          <input class="form-input" id="newProd_${s.id}" placeholder="Add product…" style="font-size:0.85rem;padding:7px 10px"
            onkeydown="if(event.key==='Enter')addProductFromConfig('${s.id}')" />
          <button class="cfg-add-btn" style="padding:7px 12px;font-size:0.82rem" onclick="addProductFromConfig('${s.id}')">+</button>
        </div>`;

        html += `</div>`;
      });
    }

    html += `<div class="config-add-form">
      <div class="config-add-row-inline">
        <input class="form-input cfg-emoji-input" id="newSectionEmoji" maxlength="2" placeholder="🛒" />
        <input class="form-input" id="newSectionName" placeholder="Section name…" style="flex:1" />
        <button class="cfg-add-btn" onclick="addSection()">Add</button>
      </div>
      <p class="cfg-hint">Type any emoji from your keyboard in the left field</p>
    </div></div>`;
    content.innerHTML = html;

  } else {
    let html = `<div class="config-section">`;

    if (state.places.length === 0) {
      html += `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">No places yet. Add one below.</p>`;
    } else {
      html += `<div class="config-list">`;
      state.places.forEach(p => {
        html += `<div class="config-row">
          <span class="config-emoji">${p.emoji || '📍'}</span>
          <div class="config-info">
            <span class="config-name">${escHtml(p.name)}</span>
            <span class="config-sub">${(p.items||[]).filter(i=>!i.checked).length} pending</span>
          </div>
          <div class="config-actions">
            <button class="cfg-btn" onclick="openEditPlace('${p.id}')">✏️</button>
            <button class="cfg-btn danger" onclick="deletePlaceFromConfig('${p.id}')">✕</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="config-add-form">
      <div class="config-add-row-inline">
        <input class="form-input cfg-emoji-input" id="newPlaceEmoji" maxlength="2" placeholder="📍" />
        <input class="form-input" id="newPlaceNameConfig" placeholder="Place name…" style="flex:1" />
        <button class="cfg-add-btn" onclick="addPlaceFromConfig()">Add</button>
      </div>
      <p class="cfg-hint">Type any emoji from your keyboard in the left field</p>
    </div></div>`;
    content.innerHTML = html;
  }
}

function addSection() {
  const name = (document.getElementById('newSectionName')?.value || '').trim();
  const emoji = (document.getElementById('newSectionEmoji')?.value || '').trim() || '🛒';
  if (!name) return;
  const colors = ['#2E7D32','#1565C0','#6A1B9A','#E65100','#00695C','#AD1457','#F57F17','#37474F','#4E342E','#0277BD'];
  const color = colors[state.sections.length % colors.length];
  state.sections.push({ id: 'sec_' + Date.now(), name, emoji, color, collapsed: false, productsCollapsed: true });
  saveState(); render(); renderConfigContent();
}

function addPlaceFromConfig() {
  const name = (document.getElementById('newPlaceNameConfig')?.value || '').trim();
  const emoji = (document.getElementById('newPlaceEmoji')?.value || '').trim() || '📍';
  if (!name) return;
  const colors = ['#1565C0','#6A1B9A','#E65100','#00695C','#AD1457','#37474F','#4E342E','#0277BD'];
  const color = colors[state.places.length % colors.length];
  state.places.push({ id: 'pl_' + Date.now(), name, color, emoji, items: [] });
  saveState(); render(); renderConfigContent();
}

function deletePlaceFromConfig(id) {
  const place = state.places.find(p => p.id === id);
  if (!confirm(`Delete "${place?.name}"?`)) return;
  state.places = state.places.filter(p => p.id !== id);
  saveState(); render(); renderConfigContent();
}

let editingPlaceId = null;
function openEditPlace(id) {
  const place = state.places.find(p => p.id === id);
  if (!place) return;
  editingPlaceId = id; editingSectionId = null;
  document.getElementById('editSectionModalTitle').textContent = 'Edit Place';
  document.getElementById('editSectionName').value = place.name;
  document.getElementById('editEmojiInput').value = place.emoji || '📍';
  document.getElementById('editColorPicker').style.display = 'none';
  document.getElementById('editColorLabel').style.display = 'none';
  document.getElementById('editSectionModal').classList.add('open');
}

document.getElementById('configModalCancel').onclick = () => {
  document.getElementById('configModal').classList.remove('open');
};

// ─── THEME ───────────────────────────────────────────────────────────────────
const THEMES = [
  { id: '',           label: 'Classic',    desc: 'Warm off-white',        swatch: ['#F7F5F0','#2E7D32'] },
  { id: 'forest',     label: 'Forest',     desc: 'Soft greens & moss',    swatch: ['#EEF2EC','#3A6B35'] },
  { id: 'earth',      label: 'Earth',      desc: 'Clay, terracotta & oak',swatch: ['#F2EDE6','#8B5E3C'] },
  { id: 'stone',      label: 'Stone',      desc: 'Warm greys & pebble',   swatch: ['#EDEAE5','#6B6254'] },
  { id: 'dark',       label: 'Dark',       desc: 'Dark with green accent', swatch: ['#1F1F1F','#5aad60'] },
  { id: 'dark-earth', label: 'Dark Earth', desc: 'Dark with warm amber',  swatch: ['#221D18','#C4885A'] },
];

function applyTheme(id) {
  document.documentElement.setAttribute('data-theme', id);
  localStorage.setItem('groceryTheme', id);
  renderThemeList();
}

function renderThemeList() {
  const current = localStorage.getItem('groceryTheme') || '';
  document.getElementById('themeList').innerHTML = THEMES.map(t => `
    <button onclick="applyTheme('${t.id}')" style="
      display:flex;align-items:center;gap:12px;padding:12px 14px;
      border-radius:12px;border:2px solid ${t.id===current?'var(--accent)':'var(--border)'};
      background:${t.id===current?'var(--accent-light)':'none'};
      cursor:pointer;text-align:left;width:100%;
      -webkit-tap-highlight-color:transparent;
    ">
      <div style="display:flex;gap:4px;flex-shrink:0">
        <div style="width:20px;height:20px;border-radius:50%;background:${t.swatch[0]};border:1px solid #ccc"></div>
        <div style="width:20px;height:20px;border-radius:50%;background:${t.swatch[1]}"></div>
      </div>
      <div>
        <div style="font-weight:700;font-size:0.9rem;color:var(--text)">${t.label}</div>
        <div style="font-size:0.75rem;color:var(--muted)">${t.desc}</div>
      </div>
      ${t.id===current?'<span style="margin-left:auto;color:var(--accent)">✓</span>':''}
    </button>`).join('');
}

// Apply saved theme on load
applyTheme(localStorage.getItem('groceryTheme') || '');

document.getElementById('editNoteInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveEditNote();
  if (e.key === 'Escape') closeEditNote();
});

document.getElementById('themeBtn').onclick = () => {
  renderThemeList();
  document.getElementById('themeModal').classList.add('open');
};
document.getElementById('themeModalCancel').onclick = () => {
  document.getElementById('themeModal').classList.remove('open');
};

// ─── DAILY AUTO-BACKUP ───────────────────────────────────────────────────────
function exportBackup() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `grocery-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem('lastBackupDate', date);
}

function checkDailyBackup() {
  const today = new Date().toISOString().slice(0, 10);
  const last = localStorage.getItem('lastBackupDate');
  if (last !== today) {
    // Only backup if there's something worth saving
    if (state.sections.length > 0 || state.products.length > 0) {
      setTimeout(exportBackup, 1500); // slight delay so app renders first
    }
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
checkDailyBackup();

// ─── SERVICE WORKER ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
